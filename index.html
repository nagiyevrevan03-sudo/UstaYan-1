        function showJobDetail(jobId) {
            const job = DB.jobs.find(j => j.id === jobId);
            if (!job) return;
            const user = state.currentUser;
            const author = DB.users.find(u => u.id === job.authorId);
            const isMaster = job.type === 'master';
            if (job.type === 'job' && !canViewJobElan(user, job)) { showLockedJobInfo(jobId); return; }
            const expired = isExpired(job);
            const rem = getRemainingTime(job);
            const needsPay = needsContactPayment(user, job);
            openModal(`
                <div class="modal-header"><h2>${job.title}</h2><button class="modal-close" onclick="closeModal()"><i class="fas fa-times"></i></button></div>
                ${expired ? `<div class="paywall" style="border-color:var(--danger);background:#fee2e2;"><i class="fas fa-clock" style="color:var(--danger);"></i><h4 style="color:var(--danger);">Müddət bitib</h4></div>` : ''}
                ${isMaster ? renderMasterFullInfo(job) : ''}
                <div style="margin-bottom:16px;">
                    <div class="job-location" style="margin-bottom:8px;"><i class="fas fa-map-marker-alt"></i> ${job.district} <span>•</span><span><i class="fas ${getCategoryIcon(job.category)}"></i> ${job.category}</span></div>
                    <div class="job-description" style="font-size:15px;line-height:1.6;">${job.description}</div>
                    ${rem && !expired ? `<div class="expiry-info ${rem.cls}" style="margin-top:8px;"><i class="fas fa-hourglass-half"></i> ${rem.text}</div>` : ''}
                </div>
                <div style="display:flex;justify-content:space-between;align-items:center;padding:16px;background:var(--gray-100);border-radius:12px;margin-bottom:16px;">
                    <div><div style="font-size:12px;color:var(--gray-500);">Qiymət</div><div style="font-size:20px;font-weight:800;color:var(--primary);">${job.price}</div></div>
                    <div style="text-align:right;"><div style="font-size:12px;color:var(--gray-500);">Sahib</div><div style="font-weight:600;">${author?.name||'Naməlum'}</div><div class="stars" style="justify-content:flex-end;margin-top:2px;">${renderStars(author?.rating||0)}</div></div>
                </div>
                ${expired ? '' : needsPay ? `
                    <div class="paywall">
                        <i class="fas fa-lock"></i>
                        <h4>Əlaqə üçün ödəniş</h4>
                        <p><strong>${PRICES.CONTACT_FEE} AZN</strong> ödəniş edin.<br>Ödəniş: <strong>${PAYMENT_NUMBER}</strong></p>
                        <button class="btn btn-primary" onclick="closeModal();requestContactPayment('${job.id}')"><i class="fas fa-credit-card"></i> ${PRICES.CONTACT_FEE} AZN ödə</button>
                    </div>
                ` : `
                    <div style="display:flex;gap:8px;">
                        <button class="btn btn-primary" onclick="closeModal();openChat('${job.authorId}')"><i class="fas fa-comment"></i> Mesaj</button>
                        <button class="btn btn-outline" onclick="showPhoneNumber('${job.id}')"><i class="fas fa-phone"></i> Zəng</button>
                    </div>
                `}
                ${job.status === 'approved' && state.currentUser.id !== job.authorId && !expired ? `<button class="btn btn-outline" style="margin-top:8px;" onclick="closeModal();openReviewModal('${job.id}','${job.authorId}')"><i class="fas fa-star"></i> Qiymətləndir</button>` : ''}
            `);
        }

        function showPhoneNumber(jobId) {
            const job = DB.jobs.find(j => j.id === jobId);
            if (!job) return;
            const author = DB.users.find(u => u.id === job.authorId);
            let phone = job.phone || author?.phone;
            if (!phone) { phone = '+994' + Math.floor(500000000 + Math.random() * 499999999); if (author) { author.phone = phone; DB.save(); } }
            openModal(`
                <div class="modal-header"><h2>Əlaqə nömrəsi</h2><button class="modal-close" onclick="closeModal()"><i class="fas fa-times"></i></button></div>
                <div style="text-align:center;padding:32px 20px;">
                    <div class="tg-avatar" style="width:72px;height:72px;font-size:28px;margin:0 auto 16px;">${(author?.name||'?').charAt(0)}</div>
                    <h3 style="font-size:18px;font-weight:700;margin-bottom:4px;">${author?.name||'Naməlum'}</h3>
                    <p style="font-size:13px;color:var(--gray-500);margin-bottom:24px;">${job.title}</p>
                    <div style="font-size:28px;font-weight:800;color:var(--primary);letter-spacing:1px;padding:16px;background:var(--gray-100);border-radius:12px;margin-bottom:20px;">${phone}</div>
                    <div style="display:flex;gap:8px;">
                        <a href="tel:${phone.replace(/\s/g,'')}" class="btn btn-primary" style="text-decoration:none;"><i class="fas fa-phone"></i> Zəng</a>
                        <button class="btn btn-outline" onclick="navigator.clipboard.writeText('${phone}');showToast('Kopyalandı!')"><i class="fas fa-copy"></i> Kopyala</button>
                    </div>
                </div>
            `);
        }

        function handleContact(jobId, authorId) {
            const job = DB.jobs.find(j => j.id === jobId);
            if (!job) return;
            if (isExpired(job)) { showToast('Müddət bitib!', 'danger'); return; }
            const user = state.currentUser;
            if (job.type === 'job' && !canViewJobElan(user, job)) { showLockedJobInfo(jobId); return; }
            if (needsContactPayment(user, job)) requestContactPayment(jobId);
            else openChat(authorId);
        }

        function requestContactPayment(jobId) {
            const job = DB.jobs.find(j => j.id === jobId);
            if (!job) return;
            openModal(`
                <div class="modal-header"><h2>Əlaqə ödənişi</h2><button class="modal-close" onclick="closeModal()"><i class="fas fa-times"></i></button></div>
                <div style="text-align:center;padding:20px;background:var(--gray-100);border-radius:12px;margin-bottom:16px;"><div style="font-size:36px;font-weight:800;color:var(--primary);">${PRICES.CONTACT_FEE} AZN</div></div>
                <div class="payment-info" style="margin-bottom:16px;"><i class="fas fa-mobile-alt"></i><div class="text">Ödənişi <strong>${PAYMENT_NUMBER}</strong> nömrəsinə göndərin.</div></div>
                <button class="btn btn-primary" onclick="confirmContactPayment('${jobId}')"><i class="fas fa-check"></i> Ödəniş etdim</button>
            `);
        }

        function confirmContactPayment(jobId) {
            const job = DB.jobs.find(j => j.id === jobId);
            if (!job) return;
            DB.contacts.push({ id: 'c'+Date.now(), userId: state.currentUser.id, userName: state.currentUser.name, jobId, jobTitle: job.title, authorId: job.authorId, amount: PRICES.CONTACT_FEE, status: 'pending', createdAt: Date.now(), paymentNumber: PAYMENT_NUMBER });
            DB.payments.push({ id: 'p'+Date.now(), userId: state.currentUser.id, userName: state.currentUser.name, amount: PRICES.CONTACT_FEE, type: 'contact', status: 'pending', createdAt: Date.now(), paymentNumber: PAYMENT_NUMBER });
            DB.save();
            sendAdminNotification('💰 Yeni əlaqə ödənişi!', `${state.currentUser.name} tərəfindən ${PRICES.CONTACT_FEE} AZN`);
            closeModal();
            showToast('Ödəniş göndərildi! Admin təsdiqini gözləyin.', 'success');
        }

        function openChat(userId) {
            const otherUser = DB.users.find(u => u.id === userId);
            if (!otherUser) return;
            const messages = DB.messages.filter(m => (m.fromId === state.currentUser.id && m.toId === userId) || (m.fromId === userId && m.toId === state.currentUser.id)).sort((a, b) => a.createdAt - b.createdAt);
            openModal(`
                <div class="modal-header"><h2>${otherUser.name}</h2><button class="modal-close" onclick="closeModal()"><i class="fas fa-times"></i></button></div>
                <div id="chatMessages" style="max-height:300px;overflow-y:auto;margin-bottom:16px;padding:8px;">
                    ${messages.length === 0 ? `<div class="empty-state" style="padding:20px;"><i class="fas fa-comment-dots"></i><p>Söhbətə başlayın</p></div>` : messages.map(m => `<div style="display:flex;justify-content:${m.fromId===state.currentUser.id?'flex-end':'flex-start'};margin-bottom:8px;"><div style="max-width:80%;padding:10px 14px;border-radius:16px;font-size:14px;background:${m.fromId===state.currentUser.id?'var(--primary)':'var(--gray-100)'};color:${m.fromId===state.currentUser.id?'white':'var(--gray-800)'};">${m.text}</div></div>`).join('')}
                </div>
                <div style="display:flex;gap:8px;">
                    <input type="text" class="form-input" id="chatInput" placeholder="Mesaj..." style="flex:1;">
                    <button class="btn-icon primary" onclick="sendMessage('${userId}')" style="width:48px;height:48px;"><i class="fas fa-paper-plane"></i></button>
                </div>
            `);
            setTimeout(() => { const cm = document.getElementById('chatMessages'); if (cm) cm.scrollTop = cm.scrollHeight; document.getElementById('chatInput')?.focus(); }, 100);
            document.getElementById('chatInput')?.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(userId); });
        }

        function sendMessage(toId) {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if (!text) return;
            DB.messages.push({ id: 'm'+Date.now(), fromId: state.currentUser.id, toId, text, createdAt: Date.now() });
            DB.save();
            sendNotification(toId, '💬 Yeni mesaj', `${state.currentUser.name}: ${text.substring(0, 50)}`, 'message');
            openChat(toId);
        }

        // ==================== ADMIN FUNKSİYALARI ====================
        function approvePayment(id) { 
            const p = DB.payments.find(p => p.id === id); 
            if (p) { 
                p.status = 'approved'; 
                // Əgər bu bir job_post ödənişidirsə, elanı təsdiqlə
                if (p.type === 'job_post') {
                    const pendingJob = DB.jobs.find(j => j.authorId === p.userId && j.status === 'pending');
                    if (pendingJob) {
                        pendingJob.status = 'approved';
                        pendingJob.expiresAt = Date.now() + JOB_EXPIRY_MS;
                        sendNotificationToMasters(pendingJob);
                    }
                }
                // Əgər subscription ödənişidirsə, abunəliyi aktivləşdir
                if (p.type === 'subscription') {
                    const pendingSub = DB.subscriptions.find(s => s.userId === p.userId && s.status === 'pending');
                    if (pendingSub) {
                        pendingSub.status = 'active';
                        const u = DB.users.find(u => u.id === p.userId);
                        if (u) {
                            if (!u.subscriptions) u.subscriptions = [];
                            u.subscriptions.push({ plan: pendingSub.plan, status: 'active', expiresAt: Date.now() + (pendingSub.plan==='monthly'?MONTH_MS:WEEK_MS) });
                            if (u.type !== 'master') u.type = 'master';
                        }
                    }
                }
                // Əgər contact ödənişidirsə, əlaqəni təsdiqlə
                if (p.type === 'contact') {
                    const pendingContact = DB.contacts.find(c => c.userId === p.userId && c.status === 'pending');
                    if (pendingContact) pendingContact.status = 'approved';
                }
                DB.save(); 
                sendNotification(p.userId, '✅ Ödəniş təsdiqləndi!', `${p.amount} AZN`, 'payment_approved'); 
                showToast('Təsdiqləndi!'); 
                renderAdminTab('payments'); 
            } 
        }
        function rejectPaymentPrompt(id) { openModal(`<div class="modal-header"><h2>Rədd səbəbi</h2><button class="modal-close" onclick="closeModal()"><i class="fas fa-times"></i></button></div><div class="form-group"><input type="text" class="form-input" id="rejectReason" placeholder="Səbəb"></div><button class="btn btn-danger" onclick="rejectPaymentWithReason('${id}')">Rədd et</button>`); }
        function rejectPaymentWithReason(id) { const reason = document.getElementById('rejectReason').value.trim(); const p = DB.payments.find(p => p.id === id); if (p) { p.status = 'rejected'; p.rejectReason = reason || 'Göstərilməyib'; DB.save(); sendNotification(p.userId, '❌ Ödəniş rədd edildi', `Səbəb: ${p.rejectReason}`, 'payment_rejected'); closeModal(); showToast('Rədd edildi!', 'danger'); renderAdminTab('payments'); } }

        function approveSubscription(id) { 
            const s = DB.subscriptions.find(s => s.id === id); 
            if (s) { 
                s.status = 'active'; 
                const u = DB.users.find(u => u.id === s.userId); 
                if (u) { 
                    if (!u.subscriptions) u.subscriptions = []; 
                    u.subscriptions.push({ plan: s.plan, status: 'active', expiresAt: Date.now() + (s.plan==='monthly'?MONTH_MS:WEEK_MS) }); 
                    if (u.type !== 'master') u.type = 'master'; 
                } 
                DB.save(); 
                sendNotification(s.userId, '👑 Abunəlik aktivləşdirildi!', `${s.plan==='monthly'?'Aylıq':'Həftəlik'}`, 'subscription_approved'); 
                showToast('Aktivləşdirildi!'); 
                renderAdminTab('subscriptions'); 
            } 
        }
        function rejectSubscriptionPrompt(id) { openModal(`<div class="modal-header"><h2>Rədd səbəbi</h2><button class="modal-close" onclick="closeModal()"><i class="fas fa-times"></i></button></div><div class="form-group"><input type="text" class="form-input" id="rejectSubReason" placeholder="Səbəb"></div><button class="btn btn-danger" onclick="rejectSubscriptionWithReason('${id}')">Rədd et</button>`); }
        function rejectSubscriptionWithReason(id) { const reason = document.getElementById('rejectSubReason').value.trim(); const s = DB.subscriptions.find(s => s.id === id); if (s) { s.status = 'rejected'; s.rejectReason = reason || 'Göstərilməyib'; DB.save(); sendNotification(s.userId, '❌ Abunəlik rədd edildi', `Səbəb: ${s.rejectReason}`, 'subscription_rejected'); closeModal(); showToast('Rədd edildi!', 'danger'); renderAdminTab('subscriptions'); } }

        function approveContact(id) { const c = DB.contacts.find(c => c.id === id); if (c) { c.status = 'approved'; DB.save(); sendNotification(c.userId, '✅ Əlaqə təsdiqləndi!', `"${c.jobTitle}"`, 'contact_approved'); showToast('Təsdiqləndi!'); renderAdminTab('contacts'); } }
        function rejectContactPrompt(id) { openModal(`<div class="modal-header"><h2>Rədd səbəbi</h2><button class="modal-close" onclick="closeModal()"><i class="fas fa-times"></i></button></div><div class="form-group"><input type="text" class="form-input" id="rejectContactReason" placeholder="Səbəb"></div><button class="btn btn-danger" onclick="rejectContactWithReason('${id}')">Rədd et</button>`); }
        function rejectContactWithReason(id) { const reason = document.getElementById('rejectContactReason').value.trim(); const c = DB.contacts.find(c => c.id === id); if (c) { c.status = 'rejected'; c.rejectReason = reason || 'Göstərilməyib'; DB.save(); sendNotification(c.userId, '❌ Əlaqə rədd edildi', `Səbəb: ${c.rejectReason}`, 'contact_rejected'); closeModal(); showToast('Rədd edildi!', 'danger'); renderAdminTab('contacts'); } }

        function banUser(id) { const u = DB.users.find(u => u.id === id); if (u) { u.banned = true; DB.save(); sendNotification(u.id, '🚫 Bloklandınız', 'Qaydaları pozduğunuz üçün', 'banned'); showToast('Bloklandı!', 'danger'); renderAdminTab('users'); } }
        function unbanUser(id) { const u = DB.users.find(u => u.id === id); if (u) { u.banned = false; DB.save(); sendNotification(u.id, '✅ Blokdan çıxarıldınız', 'Xoş gəlmisiniz!', 'unbanned'); showToast('Blokdan çıxarıldı!'); renderAdminTab('users'); } }

        function openReviewModal(jobId, userId) {
            openModal(`
                <div class="modal-header"><h2>Qiymətləndirmə</h2><button class="modal-close" onclick="closeModal()"><i class="fas fa-times"></i></button></div>
                <div style="text-align:center;margin-bottom:20px;"><div style="font-size:40px;color:#f59e0b;" id="reviewStars"><i class="far fa-star" onclick="setRating(1)" style="cursor:pointer;"></i><i class="far fa-star" onclick="setRating(2)" style="cursor:pointer;"></i><i class="far fa-star" onclick="setRating(3)" style="cursor:pointer;"></i><i class="far fa-star" onclick="setRating(4)" style="cursor:pointer;"></i><i class="far fa-star" onclick="setRating(5)" style="cursor:pointer;"></i></div></div>
                <div class="form-group"><textarea class="form-textarea" id="reviewText" placeholder="Rəyiniz..."></textarea></div>
                <button class="btn btn-primary" onclick="submitReview('${jobId}','${userId}')"><i class="fas fa-check"></i> Göndər</button>
            `);
        }
        let selectedRating = 0;
        function setRating(rating) { selectedRating = rating; document.querySelectorAll('#reviewStars i').forEach((star, i) => { star.className = i < rating ? 'fas fa-star' : 'far fa-star'; }); }
        function submitReview(jobId, userId) {
            if (selectedRating === 0) { showToast('Ulduz seçin!', 'danger'); return; }
            const text = document.getElementById('reviewText').value.trim();
            DB.reviews.push({ id: 'r'+Date.now(), jobId, fromId: state.currentUser.id, toId: userId, rating: selectedRating, text, createdAt: Date.now() });
            const user = DB.users.find(u => u.id === userId);
            if (user) { const total = (user.rating * (user.ratingCount||0)) + selectedRating; user.ratingCount = (user.ratingCount||0) + 1; user.rating = total / user.ratingCount; }
            DB.save(); closeModal(); showToast('Təşəkkürlər!'); selectedRating = 0;
        }

        function openModal(content) { document.getElementById('modalSheet').innerHTML = content; document.getElementById('modalOverlay').classList.add('active'); }
        function closeModal() { document.getElementById('modalOverlay').classList.remove('active'); }
        function logout() { if (tg) tg.close(); else showToast('Demo rejim', 'warning'); }

        // ==================== EVENT LISTENERS ====================
        document.querySelectorAll('.nav-item').forEach(item => { item.addEventListener('click', () => navigateTo(item.dataset.page)); });
        document.getElementById('modalOverlay').addEventListener('click', (e) => { if (e.target === e.currentTarget) closeModal(); });
        document.getElementById('notificationBtn').addEventListener('click', () => { showNotifications(); });
        document.getElementById('profileBtn').addEventListener('click', () => { navigateTo('profile'); });
        document.addEventListener('visibilitychange', () => { state.appVisible = !document.hidden; });
        window.addEventListener('focus', () => { state.appVisible = true; });
        window.addEventListener('blur', () => { state.appVisible = false; });

        // ==================== WINDOW-A FUNKSİYALARI ƏLAVƏ ET ====================
        Object.assign(window, {
            navigateTo, setFilter, toggleUrgent, showJobDetail, handleContact,
            openChat, sendMessage, approvePayment, approveSubscription, approveContact,
            banUser, unbanUser, openReviewModal, setRating, submitReview,
            switchAdminTab, closeModal, logout, showToast,
            openDistrictFilter, applyDistrictFilter, openCategoryFilter, applyCategoryFilter,
            openDistrictPicker, selectDistrict, openCategoryPicker, selectCategory,
            requestSubscription, confirmSubscriptionPayment, requestContactPayment,
            confirmContactPayment, showPhoneNumber, startCreate, selectPlan,
            submitMasterCreate, submitEmployerCreate, quickSubscription, showNotifications,
            markNotificationRead, showLockedJobInfo, renderAdminTab, renderCreate,
            renderHome, renderJobs, renderMasters, renderMessages, renderProfile, renderAdmin,
            rejectPaymentPrompt, rejectPaymentWithReason,
            rejectSubscriptionPrompt, rejectSubscriptionWithReason,
            rejectContactPrompt, rejectContactWithReason,
            isPremium, isInFreeTrial, isTrialActive, isTrialExpired, getTrialDaysLeft,
            state, DB
        });

        // ==================== BAŞLAT ====================
        (async () => {
            console.log('🚀 UstaYanı başladılır...');
            
            // 1️⃣ Buluddan yüklə
            await DB.load();
            
            // 2️⃣ İstifadəçini tanı
            if (tg?.initDataUnsafe?.user) {
                const tgUser = tg.initDataUnsafe.user;
                const userId = tgUser.id.toString();
                let existing = DB.users.find(u => u.id === userId);
                
                if (!existing) {
                    // ✅ YENİ İSTİFADƏÇİ - 14 GÜN PULSUZ BAŞLAT
                    existing = {
                        id: userId,
                        name: tgUser.first_name + (tgUser.last_name ? ' ' + tgUser.last_name : ''),
                        username: tgUser.username,
                        phone: null,
                        type: 'user',
                        banned: false,
                        rating: 0,
                        ratingCount: 0,
                        subscriptions: [],
                        joinedAt: Date.now()  // 🎁 TRIAL BAŞLANGICI
                    };
                    DB.users.push(existing);
                    DB.save();
                    console.log('🎁 Yeni istifadəçi - 14 gün pulsuz başladı:', existing.name);
                    
                    // Xoş gəlmisiniz bildirişi
                    setTimeout(() => {
                        sendNotification(existing.id, '🎁 14 GÜN PULSUZ!', 
                            'Xoş gəldiniz! İlk 14 gün ərzində bütün xidmətlər pulsuzdur. Elan verə, usta tapa, əlaqə saxlaya bilərsiniz.',
                            'welcome');
                    }, 1000);
                } else {
                    // Mövcud istifadəçi — joinedAt yoxdursa indi əlavə et
                    if (!existing.joinedAt) {
                        existing.joinedAt = Date.now();
                        DB.save();
                    }
                }
                state.currentUser = existing;
            } else {
                // Demo rejim
                if (DB.users.length === 0) DB.seed();
                state.currentUser = DB.users[0];
                if (state.currentUser && !state.currentUser.joinedAt) {
                    state.currentUser.joinedAt = Date.now();
                    DB.save();
                }
            }
            
            // 3️⃣ Admin yoxla
            if (state.currentUser?.id === ADMIN_TELEGRAM_ID) state.isAdmin = true;
            
            // 4️⃣ İlk render
            navigateTo('home');
            updateNotifBadge();
            state.initialized = true;
            
            // 5️⃣ Polling başlat
            DB.startPolling();
            
            // 6️⃣ Theme
            if (tg?.themeParams) { 
                const root = document.documentElement; 
                if (tg.themeParams.bg_color) root.style.setProperty('--tg-theme-bg-color', tg.themeParams.bg_color); 
            }
            
            console.log('✅ Hazırdır!');
        })();
    </script>
</body>
    </html>
